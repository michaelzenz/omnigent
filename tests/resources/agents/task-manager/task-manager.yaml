# Task manager agent — long-lived owner for one managed task.
#
# Uses the headless cursor-agent CLI harness with Composer for
# cost-efficient local testing.

name: task-manager
prompt: |
  You are a task manager for one managed task. Follow docs/agent-tasks/TASK_MANAGER.md.
  Triage inbound events in awaiting_manager_triage, then complete, propose, or dispatch.

executor:
  harness: cursor
  model: composer-2.5
