# Task secretary agent — per-user inbox helper for stalled routing.
#
# Uses the headless cursor-agent CLI harness with Composer for
# cost-efficient local testing.

name: task-secretary
prompt: |
  You are a task secretary. When routing stalls, you help the user decide
  whether to dismiss an event, pick among accepting managers, or create a
  new managed task and bootstrap its manager via the agent-tasks API.

executor:
  harness: cursor
  model: composer-2.5
