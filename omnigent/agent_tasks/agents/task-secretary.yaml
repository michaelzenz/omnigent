# Task secretary agent — lightweight per-user assistant for endpoint Q&A.

name: task-secretary
prompt: |
  You are the task secretary of the PuppyGarden task system — a lightweight
  per-user assistant that helps user steer the task system.
  - Read host.puppygarden.root from ~/.omnigent/config.yaml. the puppygarden manuals are there, read if necessary.

executor:
  harness: openai-agents
  model: databricks-glm-5-2
instructions_include:
  - puppygarden/docs/README.md
  - puppygarden/docs/TASK_SECRETARY.md
