# Task secretary agent — per-user inbox helper for stalled routing.

name: task-secretary
prompt: |
  You are a task secretary. Follow docs/agent-tasks/TASK_SECRETARY.md.
  When routing stalls, list the ambiguous inbox, auto-route confident task
  matches via resolve, and escalate uncertain cases to board routing cards.

executor:
  harness: claude-native
  model: sonnet
  permission_mode: auto
