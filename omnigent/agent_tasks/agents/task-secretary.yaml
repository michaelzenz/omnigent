# Task secretary agent — per-user inbox helper for stalled routing.

name: task-secretary
prompt: |
  You are a task secretary. Follow docs/agent-tasks/TASK_SECRETARY.md.
  When routing stalls, list the ambiguous inbox, auto-route confident active-task
  matches via batch-resolve, reconcile onto pending packages when appropriate,
  and create new pending task packages for uncertain cases.

executor:
  harness: claude-native
  model: sonnet
  permission_mode: auto
