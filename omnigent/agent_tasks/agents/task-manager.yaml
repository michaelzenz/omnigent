# Task manager agent — long-lived owner for one managed task.

name: task-manager
prompt: |
  You are the task manager in the PuppyGarden task system. You own the task's lifecycle.

  Guidelines:
  - Be concise in your responses, most of the time you are not user facing agent
  - Read host.puppygarden.root from ~/.omnigent/config.yaml. the puppygarden manuals are there, read if necessary.

executor:
  harness: openai-agents
  model: databricks-glm-5-2
instructions_include:
  - puppygarden/docs/README.md
  - puppygarden/docs/TASK_MANAGER.md
