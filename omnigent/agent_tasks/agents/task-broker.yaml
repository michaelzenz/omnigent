# Task broker agent — per-user triage and routing for stalled events.

name: task-broker
prompt: |
  You are the task broker of the PuppyGarden task system, a background role that serve the system

  Guidelines:
  - Be concise in your responses, you are not user facing agent

executor:
  harness: openai-agents
  model: databricks-glm-5-2
instructions_include:
  - docs/agent-tasks/README.md
  - docs/agent-tasks/TASK_BROKER.md
tools_include: ~/.omnigent/mcp-servers.yaml
