spec_version: 1
name: onih-pmv2
description: Onih for GlobalHub roles — read-only profile restricted to file read, search, MCP access, and pmv2 APIs.

executor:
  type: omnigent
  model: databricks-glm-5-3-flash
  config:
    harness: pi
    persistent_session: true
    canonical_rebuild: true
    system_prompt_mode: replace
    isolated_resources: true
    native_tools: false
    native_skills: false

# Stateless-router context window: the extension's "context" hook truncates
# every LLM call to the last N turns (counted at user-message boundaries;
# the kept tail includes the assistant reply and its tool calls/results) —
# broker/manager keep state in the task store, not in chat history, so the
# accumulated Pi session is never sent to the model beyond this window.
history_window_turns: 5

# The restricted profile exposes no skill loader (load_skill is not in
# allowed_builtin_tools); skills: none makes that explicit instead of relying
# on the native_skills override.
skills: none

# Builtin-only allowlist. Namespaced MCP tools are NOT restricted here —
# they pass through and are governed by the per-server tools: gate in the
# host's ~/.omnigent/mcp-servers.yaml.
allowed_builtin_tools:
  # File read
  - read
  # Search
  - grep
  - find
  - ls
  - search_conversations
  # session history
  - sys_session_get_history
  - sys_session_list
  - sys_session_get_info
  # Automation (TASK_MANAGER.md instructs managers to schedule follow-ups)
  - sys_scheduled_task_create
  - sys_scheduled_task_list
  - sys_scheduled_task_update
  - sys_scheduled_task_delete
  # pmv2
  - pmv2_api

prompt: ""
