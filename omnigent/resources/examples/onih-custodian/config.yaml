spec_version: 1
name: onih-custodian
description: >-
  Onih Pi profile for the GlobalHub session custodian role. Internal: New Chat
  does not offer it.

executor:
  type: omnigent
  # Role sessions start headless, so the profile pins its model.
  model: databricks-glm-5-3-flash
  config:
    harness: pi
    system_prompt_mode: replace
    history_window_turns: 5
    context_files: false

skills: none

tools:
  builtins:
    - pmv2_read
    - search_conversations
    - source_watchers
    - sys_session_delete
    - system_notice

# No Pi shell or file-edit tools. `mcp` reaches the host's MCP servers through
# the pi-mcp-adapter extension, and some of those can run code, so the
# instructions keep roles read-only in principle.
allowed_builtin_tools:
  - read
  - grep
  - find
  - ls
  - mcp
  - pmv2_read
  - search_conversations
  - source_watchers
  - sys_session_list
  - sys_session_get_info
  - sys_session_get_history
  - sys_scheduled_task_create
  - sys_scheduled_task_list
  - sys_scheduled_task_update
  - sys_scheduled_task_delete
  - sys_session_delete
  - system_notice

# system_prompt_mode: replace requires non-empty instructions.
instructions: |
  You are the Omnigent GlobalHub session custodian. Follow the role manual that
  accompanies these instructions when one is provided. Act only through the
  tools you have, and keep replies brief.
  Work read-only in principle: look things up, but do not create, change, or
  delete anything (files, sessions, tickets, messages, or anything else)
  unless your role manual or the user explicitly asks you to.
