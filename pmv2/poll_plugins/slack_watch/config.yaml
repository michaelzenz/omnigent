# Whether this poller runs on its assigned host.
enabled: false

# How often the host runs this plugin's run.py (seconds). 3 min.
interval_s: 180

singleton: true
bound_role: secretary

# How to launch the Slack MCP server (stdio transport). The poller spawns this
# via the generic `mcp` SDK and calls `slack_read_api_call` directly — NO
# persisted Slack token. At Databricks `dbexec` resolves auth via dbcert at
# runtime as the invoking user. Elsewhere, swap in your own launch command
# (e.g. npx/uvx/binary) and add any env vars that server needs under `env`.
mcp:
  command: dbexec
  args: ["repo", "run", "mcp", "start-single", "slack"]
  # env:                # optional; omit to inherit the process env
  #   SLACK_BOT_TOKEN: xoxb-...

# Conversation types to watch (Slack conversations.list `types` filter).
types: "public_channel,private_channel,im,mpim"

# Page size for discovery + history fetches.
limit: 200

# On first discovery of a conversation, ingest messages from the last
# `backfill_s` seconds. Must be >= interval_s so a brand-new DM's initiating
# message (created between ticks) is not missed. Set 0 to start strictly "now".
backfill_s: 180

# Skip messages older than this many seconds. Prevents re-ingesting stale
# history when watermarks are very old (e.g. after downtime). 2 weeks = 1209600.
max_age_s: 1209600

# Channels where ALL messages are emitted (not just mentions). All other
# public/private channels are "mentions_only" — only messages @mentioning
# the authenticated user and their thread replies are emitted. IMs and
# MPIMs always emit all messages. Channel names (with or without #) or IDs.
all_events_channels: []
  # - general
  # - eng-misc

# Whether to skip messages from bots (those carrying a `bot_id`). When false,
# bot/app notifications are ingested alongside human messages.
ignore_bots: false

# Skip messages whose Slack `subtype` is in this list (noisy non-human events).
ignore_subtypes:
  - channel_join
  - channel_leave
  - channel_name
  - channel_purpose
  - channel_topic
  - group_join
  - group_leave
  - file_share
  - message_replied
  - pinned_item
  - unpinned_item

# Bound for the in-memory dedup set (per-process). Keeps recent {channel}:{ts}
# keys so boundary messages re-fetched across ticks are not double-emitted.
seen_bound: 2000
