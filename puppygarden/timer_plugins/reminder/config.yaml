# When this timer fires (unix timestamp, seconds). Set a future time to arm.
fire_at: 1700000000

# Singleton: fire this timer on exactly one host — the host pinned to the
# secretary role (read fresh from the roles store, cached ~60s). The pin is
# sticky/user-controlled; if that host is down the timer does not fire until
# the user reassigns the role. A skipped singleton timer is not marked fired,
# so a later winning host can still fire the due fire_at.
singleton: true
bound_role: secretary
