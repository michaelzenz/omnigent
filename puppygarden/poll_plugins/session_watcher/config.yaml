# How often the host runs this plugin's run.py (seconds).
interval_s: 60

# Singleton: run this plugin on exactly one host — the host pinned to the
# secretary role (read fresh from the roles store, cached ~60s). The pin is
# sticky/user-controlled; if that host is down nobody runs the plugin until
# the user reassigns the role. Avoids duplicate polling across hosts.
singleton: true
bound_role: secretary

# Directories to scan for external session files.
scan_dirs:
  - ~/.codex/sessions
  - ~/.cursor/projects

# Number of lines to include in the discovery transcript_snippet.
snippet_lines: 50

# Only consider sessions modified within this window (seconds).
recency_window_s: 86400  # 1 day

# Only emit events for sessions idle for at least this long (seconds).
# Prevents triaging sessions that are mid-turn.
sink_time_s: 180  # 3 minutes
